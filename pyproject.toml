[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetwin-backend"
version = "0.1.0"
description = "Mascot conversation, survival forecast, cited educational plans and quiz API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  # Survival model inference; scikit-learn matches the version that pickled the preprocessor.
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "scikit-learn==1.9.1",
  "joblib>=1.4,<2",
  "h5py>=3.11,<4",
  "anthropic>=2.3.0",
  "pypdf[crypto]>=5,<7",  # AES-encrypted PDFs (most portal downloads) need cryptography
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["server"]
include = ["lifetwin*"]

[tool.setuptools.package-data]
"lifetwin.quiz" = ["*.json", "content/*.json"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lifetwin"]
