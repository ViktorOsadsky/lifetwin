body{margin:0}
.scr{width:390px;height:844px;position:relative;overflow:hidden;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#4A2F25;-webkit-font-smoothing:antialiased}
.g-lav{background:radial-gradient(140% 70% at 50% 18%,#F0ECFD 0%,#E6E0FA 72%)}
.g-mint{background:radial-gradient(140% 70% at 50% 18%,#E3F5EC 0%,#D3EEE2 72%)}
.g-peach{background:radial-gradient(140% 70% at 50% 18%,#FDEBE1 0%,#FBE0D2 72%)}
.g-night{background:radial-gradient(140% 70% at 50% 22%,#1B2245 0%,#121731 72%)}
.fd{font-family:Fredoka,system-ui,sans-serif;font-weight:600}
.pn{position:absolute;box-sizing:border-box;border:1.5px solid #A88B7D;border-radius:28px;background:#FFFDF8;box-shadow:0 6px 16px rgba(74,47,37,.14),inset 0 1px 0 rgba(255,255,255,.75)}
.g-night .pn{box-shadow:0 6px 16px rgba(5,8,25,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.win{border-radius:30px}
.pa{position:absolute;left:6px;top:6px;right:6px;bottom:6px;border-radius:24px;overflow:hidden}
.pa img.plate{position:absolute;display:block;object-fit:cover}
.key{position:absolute;left:6px;top:6px;right:6px;bottom:6px;border:1px solid rgba(226,179,87,.7);border-radius:24px;pointer-events:none}
.spk{position:absolute;width:16px;height:16px;pointer-events:none}
.banner{position:absolute;left:50%;transform:translateX(-50%);height:44px;max-width:240px;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:6px;background:#FFFDF8;border:1.5px solid #A88B7D;border-radius:22px;box-shadow:0 6px 16px rgba(74,47,37,.14),inset 0 1px 0 rgba(255,255,255,.75);font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:22px;white-space:nowrap;z-index:3}
.banner .nm{overflow:hidden;text-overflow:ellipsis}
.banner .br{color:#B4532F}
.btn{appearance:none;-webkit-appearance:none;margin:0;font:inherit;color:#4A2F25;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid #8C6B5D;background:#FFFDF8;padding:0}
.btn.fd{font-family:Fredoka,system-ui,sans-serif;font-weight:600}
.lip{background:#9FD9C3;box-shadow:inset 0 -3px 0 rgba(95,175,147,.7),0 6px 16px rgba(74,47,37,.14),inset 0 1px 0 rgba(255,255,255,.75)}

.link{border:0;background:transparent;box-shadow:none;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700;font-size:18px;min-height:48px}
.back{position:absolute;width:52px;height:52px;border-radius:26px;box-shadow:0 6px 16px rgba(74,47,37,.14),inset 0 1px 0 rgba(255,255,255,.75);z-index:2}
.tail{position:absolute;width:20px;height:20px;background:#FFFDF8;border:1.5px solid #A88B7D;border-top-color:transparent;border-right-color:transparent;box-sizing:border-box}
.dots{display:flex;gap:8px;justify-content:center;align-items:center}
.dot{width:12px;height:12px;border-radius:6px;border:2px solid #8C6B5D;box-sizing:border-box;background:#FFFDF8}
.dot.done{background:#4A2F25;border-color:#4A2F25}
.dot.now{width:30px;background:#9FD9C3;border-color:#7A5B4E}
.chip{width:100%;height:52px;border-radius:26px;justify-content:flex-start;padding:0 16px;font-size:17px;font-weight:700;box-shadow:0 3px 10px rgba(74,47,37,.10)}
.tab{width:66px;height:70px;border-radius:18px;border:2px solid transparent;background:transparent;flex-direction:column;gap:3px;font-size:17px}
.tab.on{background:#9FD9C3;border-color:#7A5B4E;font-weight:700}
.tile{width:104px;height:88px;border-radius:22px;background:#FFFDF8;flex-direction:column;gap:2px;font-size:17px;position:relative;box-shadow:0 3px 10px rgba(74,47,37,.10)}
.tile:nth-child(odd){transform:rotate(-1deg)}
.tile:nth-child(even){transform:rotate(1deg)}
.tile svg.it{filter:drop-shadow(0 2px 3px rgba(74,47,37,.18))}
.tile.on{background:#9FD9C3;border-color:#7A5B4E;font-weight:700;box-shadow:0 6px 16px rgba(74,47,37,.14),inset 0 1px 0 rgba(255,255,255,.75)}
.badge{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:15px;background:#4A2F25;display:flex;align-items:center;justify-content:center;border:2px solid #FFFDF8}
.thumb{width:42px;height:42px;border-radius:21px;overflow:hidden;position:relative;border:2px solid #8C6B5D;background:#FBF4EA;flex:none;box-sizing:border-box}
.thumb img{position:absolute;display:block}
.ncard{background:#1E2547;color:#FBF4EA;border-color:#0B0F26}
.ncard .nkey{position:absolute;left:6px;top:6px;right:6px;bottom:6px;border:1px solid rgba(232,182,76,.7);border-radius:22px;pointer-events:none}
.ncard .link{color:#E8B64C}
