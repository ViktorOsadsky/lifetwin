<!-- Why? sheet: one version only, see WHY_SHEET in each file ("two made-up versions of you"). -->
<!-- Flutter: each page is a scroll view with the dock AND back pinned (back: floating 52x52 at left 30, top 97 on plate screens; a fixed #FFFDF8 title bar on header screens, 1.5px #A88B7D bottom border once content scrolls under it); scroll content gets bottom padding = dock height + 16. Flow layout with min-heights only, so 200% text grows instead of clipping. Plate windows have fixed heights; twins sit in fixed boxes, one scale per character (stand = 196px), feet on one baseline. -->
<!-- Engine levers (TwinRepository.experiment(), PR #47) in order: smoking_status 2 -> 1 (current smokers only); vigorous_recreation_min_week step 15 up to 300; moderate_recreation_min_week step 15 up to 600; sleep_hours step 0.5, offered only under 7 h, designed up to 8 (engine flags above 8 as sleep_above_8, not counted); sedentary_min_day step 30 down to 60. Levers only move the way guidance points. Weight: never (weight_not_a_lever). Per-lever chips read LeverFlag {id, counted, reason, reasonText}. ExperimentResult.status -> artboard: available (Y-1..Y-4, Y-7), current_unavailable (Y-8 missing_inputs, Y-9 unsupported_age under 30 / over 85, Y-10 unsupported_profile), extrapolated ages 30-34 and 80-85 (Y-16 Rough guide, Y-17 Rough guide + tiny), no_change / not_counted / alternative_unavailable / invalid_input (Y-15). -->
<!-- Field -> plain words: age = "Age"; bmi = "Height and weight"; sleep_hours = "Hours of sleep"; vigorous_recreation_min_week = "Hard exercise each week"; moderate_recreation_min_week = "Moderate exercise each week"; sedentary_min_day = "Time spent sitting each day"; sex_nhanes = "Sex at birth"; smoking_status = "Smoking"; diabetes_diagnosed = "Diabetes"; hypertension_diagnosed = "Being told you have high blood pressure"; general_health = "How you rate your health" -->
