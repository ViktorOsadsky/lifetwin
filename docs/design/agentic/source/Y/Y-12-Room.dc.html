<!-- Engine levers (TwinRepository.experiment(), PR #47) in order: smoking_status 2 -> 1 (current smokers only); vigorous_recreation_min_week step 15 up to 300; moderate_recreation_min_week step 15 up to 600; sleep_hours step 0.5, offered only under 7 h, designed up to 8 (engine flags above 8 as sleep_above_8, not counted); sedentary_min_day step 30 down to 60. Levers only move the way guidance points. Weight: never (weight_not_a_lever). Per-lever chips read LeverFlag {id, counted, reason, reasonText}. ExperimentResult.status -> artboard: available (Y-1..Y-4, Y-7), current_unavailable (Y-8 missing_inputs, Y-9 unsupported_age under 30 / over 85, Y-10 unsupported_profile), extrapolated ages 30-34 and 80-85 (Y-16 Rough guide, Y-17 Rough guide + tiny), no_change / not_counted / alternative_unavailable / invalid_input (Y-15). -->
