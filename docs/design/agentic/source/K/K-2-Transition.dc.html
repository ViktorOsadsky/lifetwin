<!doctype html>
<!-- LifeTwin K screens (Home and health score), v1. Placeholder data is listed in the KN- board notes on the canvas, never inside the phone UI. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- K-2 = a key frame of the reveal-to-Home hand-off, not a separate screen (timeline on board KN-2). Folded with the score ruling: the score is already revealed on K-1, so K-2 no longer introduces it; it carries it. t = 450 ms of 800: the night plate has cross-faded to the sunny room; the score card (shared element, Hero tag "score") is landing in Home's score slot (gold halo fading, data-anim="land"); the outlook block has shrunk into a navy pill landing where the quiet "See your estimate" link lives (Hero tag "estimate", data-anim="tuck"); the Daily check-in button is still rising into place (opacity .45, +22px). During the hand-off the transient pill and the faded check-in are NON-interactive (inert, aria-hidden, no hit testing; Flutter IgnorePointer + ExcludeSemantics) until the motion ends. The 0-to-72 count-up is aria-hidden; VoiceOver hears only the final "72 of 100". Reduced motion: no key frames; one 150 ms cross-fade from K-1 to K-3. -->
<!-- K Home: one idea, one primary action. Order: the Room (pre-rendered sunny room, sun glow + contact shadow, bear sprite) -> the health score card (the hero; taps to K-5) -> the Daily check-in, THE primary button (mint lip, 84pt, full width) -> a quiet "See your estimate" text link (secondary ink, 48pt target; the only way back to the Outlook). Pinned: History + Settings header (top) and the Customize / Talk / What-if bar (bottom); neither scrolls. The bar's Fortune button is retired: the Outlook is never front and centre after the reveal. The health score is a PLACEHOLDER (0-100 assumed, Viktor's spec pending): the medal is one constant mint, never coloured or labelled by value; no bands, no formula, no points per habit. The score never reshapes the twin; the twin's pose follows TwinState only. Experiments never change the score. -->
