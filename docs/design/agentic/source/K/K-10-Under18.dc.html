<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- K-10 Under 18 (owner ruling: the score, lifespan, outlook and health advice all need 18 or over). Age comes from the first onboarding question; under 18, onboarding ends after the basics (no health questions, no Apple Health, no document upload, no reveal, no daily check-in, no recommendations). Still works: Mochi and the room, Talk (small talk only, no advice), Customize, the quiz (game health only, never medical). One friendly line, no scolding, no "come back later" pressure. History pill hidden (nothing health-related is logged). Settings stays pinned (Delete my data lives there). Polish: the age line is a quiet info line (icon + text, no card, nothing to tap); Play the quiz is the only Quiz entry (the bar keeps Customize and Talk); the plate grows to 330 so there is no dead gap above the bar. -->
