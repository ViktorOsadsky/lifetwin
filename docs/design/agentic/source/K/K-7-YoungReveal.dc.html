<!doctype html>
<!-- LifeTwin K screens (Home and health score), v1. Placeholder data is listed in the KN- board notes on the canvas, never inside the phone UI. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- NOT FOR BUILD: "Awaiting Viktor's method, not for build" (tag sits outside the phone frame on the canvas, board KN-1b / KN-7). X and Y are literal placeholders; never a real-looking age. -->
<!-- Persona: 27 years old (owner ruling: gets BOTH the lifespan estimate and the health score). The 5-year Cox statement is not available under 30 (package: "Annual estimates support ages 30-85 only."), so the lifespan layout is the only estimate shown, with literal X-Y placeholders. Open question for Viktor: the draft method uses the Cox relative risk, which is fitted on ages 35-79 (extrapolated 30-85); how is it defined at 27? -->
<!-- K-1b: same composition as K-1 (score first), with the lifespan block as the secondary outlook. Draft method (Viktor): CDC life table adjusted by the Cox relative risk -> expected age ("about X") + 25th-75th percentile ("Most likely X-Y"). X and Y are literal placeholders. "Estimate, not a promise" sits behind the (i) button (48pt), which opens the What this means sheet. The source line "From US life tables and answers like yours" is draft copy until the method lands. No bear array: the 100-bear grid belongs to the 5-year statement. K-1 stays the fallback whenever the method is unavailable. -->
<!-- Score next to every outlook (owner ruling): the health score card comes FIRST in the DOM and on screen, above the outlook, larger (112pt medal, 26pt title, cream card on night) and taps to K-5. Tagline (interim, pending the owner's pick): "Feeling good now, and healthy years ahead."; it is on every score card and dropped at text scale 1.5x or more. healthScore is a PLACEHOLDER 72 everywhere (0-100 assumed; Viktor's spec pending; no bands, no formula). The outlook block is secondary: smaller type, no hero bear array on the reveal. -->
