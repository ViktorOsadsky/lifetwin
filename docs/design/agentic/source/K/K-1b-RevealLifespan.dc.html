<!doctype html>
<!-- LifeTwin K screens (Home and health score), v1. Placeholder data is listed in the KN- board notes on the canvas, never inside the phone UI. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- Lifespan reveal = PROOF OF CONCEPT (owner ruling): shown ONCE at the end of onboarding (repo.lifespanRevealSeen), then the score is the hero; K-6 shows the same estimate afterwards. Engine: repo.lifespanEstimate {expectedAge, p25Age, p75Age, expectedYear, status, caveat}. A year and an age, never a day: "Around 2051" big, "about age 89, most likely 84-93" smaller; "Rough estimate, not a promise" behind (i). Every value is a SAMPLE. Ages 18-85; Rough guide badge outside 35-79. -->
<!-- K-1b: the reveal (proof of concept): score card first and stronger, the lifespan block beneath it. Method (Viktor): CDC life table adjusted by the Cox relative risk -> expectedYear, expectedAge, p25Age-p75Age. "Rough estimate, not a promise" sits behind the (i) button (48pt), which opens the What this means sheet. No bear array: the 100-bear grid belongs to the 5-year statement. K-1 (5-year statement) is the fallback whenever lifespanEstimate.status is not available. -->
<!-- Score next to every outlook (owner ruling): the health score card comes FIRST in the DOM and on screen, above the outlook, and is visually stronger (cream card on night, 48pt value) and opens K-5. Tagline (final): "Feeling good now, and healthy years ahead."; on every score card, dropped at text scale 1.5x or more. Health score = public healthScore = -(Viktor's log_relative_hazard_score): higher is better, 0 = the survey average; every value is a SAMPLE while Viktor adjusts the scoring, + ageGroupPercentile line (SAMPLE until the engine ships it). See board KN-SC. -->
