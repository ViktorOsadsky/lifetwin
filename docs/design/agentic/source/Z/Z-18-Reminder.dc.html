<!doctype html>
<!-- LifeTwin agentic screens (prefix Z), v1. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Notification permission is requested in context, the first time the person turns a reminder on (HIG: just-in-time, with a reason). iPhone asks once, the first time a reminder is turned on. Reminder rows are whole-row switches (SwitchListTile + MergeSemantics). Notification copy never mentions health details on the lock screen and never uses guilt ("You missed..."). Reminders are scheduled locally on the phone. -->

.scr{width:390px;position:relative;overflow:hidden;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#4A2F25;-webkit-font-smoothing:antialiased}
