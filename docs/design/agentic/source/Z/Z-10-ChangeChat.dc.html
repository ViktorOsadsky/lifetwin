<!-- LifeTwin agentic screens (prefix Z), v1. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- No direct editing (owner): saved answers are read-only everywhere; Change or Update opens this sheet. API (#50): start {profile, field?, memory_consent}; turn {action: reply|confirm|cancel|resume, state, profile, memory_consent, text?, input_mode}. Response = check-in shape + profile_update (only on the yes turn) + habit_note (only with memory consent) + emergency (mascot concerned) + complete. Save goes through TwinRepository.saveConversationProfile, only after "Yes, save" (confirm). "Not quite" = reply again. Close before confirm = cancel; nothing saved. The sheet stays open after complete until the person closes it. Close is pinned in the header and never scrolls away. Experiment levers never call this. -->
<!-- Z-10: start with no field (e.g. Talk -> "update something"). Mochi opens with "What would you like to update?", then reads back before any save. -->
