<!doctype html>
<!-- LifeTwin S screens (upload, Today's plan, drivers), v2 (round 2). Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view; back, Home and close controls and the dock are pinned outside it (device-test rule: they never scroll away); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Large text (textScale > 1.3): Yes / Change / Skip and Done / Not done rows stack full width (min height 52, gap 10); reason chips and tags wrap; the Outlook year strip wraps 3 + 2 (cells at least 96px wide); two-button docks stack. -->
<!-- Document contract (codex/c-document-upload, draft): inputs = VisionKit document camera scan, up to 10 photos (JPEG/PNG/HEIC), or a PDF (first 10 pages only; the person is told). OCR runs on the phone; only the recognised text goes to POST /api/documents/extract. Candidates {field, use: model_input|information, value, unit, date, date_basis, source_text, page, section, confidence, method}; status found | nothing_found | unreadable, plus notices and provider_status. Nothing is stored except values the person confirms; confirmed values carry the source label "From your document". Privacy sentence (How? sheet, verbatim): "Your document stays on this phone; only the words are sent to LifeTwin's server to find your numbers, and nothing is kept." -->
<!-- Room additions for Z-11: the "Upload a document" pill sits beside "Use my Apple Health" (both shown while an answer could still be filled or refreshed; they collapse once everything is known). "Today's plan" is the primary Room row (the daily secretary, S-11); the daily check-in row (Z-15) sits below it. Pill width: two pills share the row at 375pt; at 200% text they stack. -->
