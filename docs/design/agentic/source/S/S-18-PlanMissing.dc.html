<!-- Flutter: the page is a scroll view; back, Home and close controls and the dock are pinned outside it (device-test rule: they never scroll away); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Large text (textScale > 1.3): Yes / Change / Skip and Done / Not done rows stack full width (min height 52, gap 10); reason chips and tags wrap; the Outlook year strip wraps 3 + 2 (cells at least 96px wide); two-button docks stack. -->
<!-- Plan contract (codex/d-twin-coach, contracts/coach.plan*.schema.json): POST /api/coach/plan, refreshed on app open or resume (nothing runs in the background). Reply {revision_id, based_on, items[2-4]{action_id, kind, time_of_day, title, message, why, source_url, minutes, controls: accept|edit|dismiss}, changes (one plain line per item), trace (facts -> rule -> evidence -> action), mood, alert, notices, memory_instruction, provider_status}. Card mapping: time_of_day -> time label, title -> the bold line, source_url -> source chip, controls -> Yes / Change / Skip (Change = edit). Feedback per item: accepted | edited | dismissed | done | not_done + reason (chips or spoken via "Say why"). Every card shows "Awaiting professional review" (17px #6B4E42) plus its source link. Mood -> sprite: happy -> wave or stand, proud -> proud, cozy -> sit, waiting -> thinking, concerned -> concerned, celebrate -> jump. Educational habit planning, never prescribing: no health score, no survival number from feelings, no supplements. Plan items and feedback are history on the phone (actual logs, kept apart from experiments); they never change confirmed answers, model inputs or the Outlook. Entry: the "Today's plan" row in the Room (S-2). -->
<!-- Missing data: sleep_hours unknown (the person said "I don't know"). The plan still personalises what is known; the unknown topic uses the built-in tip, tagged. Tell Mochi about sleep opens the change conversation for that one field. No healthy default is filled and no number appears. -->
