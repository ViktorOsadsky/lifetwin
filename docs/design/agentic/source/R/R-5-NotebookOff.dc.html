<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- Notes are dated on check-in days: Oct 18 (the intake and weekly check-in conversation) and Oct 23 (Friday daily check-in, "Didn&#8217;t sleep well"). -->
<!-- Notes belong to the one example person used across R (canonical Rosa: 64, female, never smoked; z_model/persona_out.json, the same person as K, S and Z). -->
<!-- Mochi's notebook = habit notes from the probes (Z-8/Z-9), memory_consent true only. Read-only: no edit fields, no delete-swipe per note; "Change with Mochi" opens the change chat (Z-10: which note? what changed? read-back, then save). Notes shape suggestions in the person's own words; they never change model inputs or numbers. The memory switch here is the same setting as in My data (Z-21). ASSUMED (flag for the engine): turning memory off clears the notes ("Turning memory off forgets these notes."); confirm before build. -->
<!-- Memory OFF empty state (what it is + why empty + how to start). The one action is the switch row at the top (no second button, so neither side is pushed); turning it on sets memory_consent true (a setting, not health data) and returns here with an empty notebook; notes appear after the next probe or check-in. Framed as better results, never as a requirement. -->
