<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- Large text: every font size is 1.6x the 390 design (iOS Dynamic Type around AX1; Flutter MediaQuery.textScaler 1.6) in a 320x693 frame (Display Zoom). Type at 1.6x: body and secondary text 17 -> 27 (secondary keeps #6B4E42), small captions 15 -> 24, emphasis 18 -> 29, titles 28 -> 45, buttons 24 -> 38, bubbles 20 -> 32, banner 22 -> 35. Reflow rules, switched on when the 17pt body scales to 24pt or more (textScaler >= 1.41): rows stack, side-by-side pairs become a column, words never break mid-word (no forced hyphens; titles wrap at spaces), pinned controls stay pinned, and anything that does not fit scrolls. Targets stay at least 48pt and grow with the text. Reduced motion (MediaQuery.disableAnimations / iOS Reduce Motion): the twin shows a static pose (stand or the mood pose), no idle bob, blink or sparkle loops; screen changes cross-fade in 150 ms instead of sliding; the Talk button&#8217;s listening ring is a steady outline, not a pulse. -->
<!-- History (read-only). TwinRepository history API (working names from the engine: history({from, to}), dayLogs, goodWeeks(); field names ASSUMED): history({from, to}) -> [HistoryEntry{id, kind: daily|quick|weekly|change|health_import|document_upload, at (local date-time), answers[{field|question_id, plain_text}], source: you_said|apple_health, outlook_updated: bool}]; weekSummaries() -> [{week_start, sleep_hours, moderate_recreation_min_week, vigorous_recreation_min_week, sedentary_min_day, sources{}, used_for_outlook: bool}]. Check-in kinds follow the engine (kind: daily|weekly|quick); change = /api/change saved turn (profile_update); health_import = a confirmed Apple Health read-back; document_upload = values confirmed one by one from an uploaded document (POST /api/documents/extract candidates with use: model_input; only Yes answers are logged, source "From your document"; the document itself is never stored). Only saved things appear (confirmed answers; a cancelled change is not logged). Experiment what-ifs never appear here. Weeks: goodWeeks() = Mon-Sun weeks with a finished check-in on 4 or more DIFFERENT days (engine History rules); other weeks are unmarked (solid empty circle), no quota words. Never streaks; a missed day is blank, never zero, never red. Entries are read-only; tapping a day opens the day sheet (R-17), whose Change opens the Mochi change conversation (Z-30 field change; Z-10 read-back). Storage line: short form on screen; tap shows the required sentence: "Saved on this phone. LifeTwin&#8217;s server reads your answers to understand them, but doesn&#8217;t keep them." Delete my data (Z-22) wipes all of it. Entry points: Room header (R-1) and Settings > History (R-2). -->
