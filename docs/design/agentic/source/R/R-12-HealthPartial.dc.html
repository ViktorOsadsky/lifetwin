<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- F14 Apple Health fallbacks; the conversation always continues and keeps what was found. iOS never tells an app whether READ access was denied: a denied type returns no samples, exactly like an empty one. So "denied" and "nothing found" are one honest screen (R-11), worded so it is true in both cases (app health_screen.dart nothingFound says the same). Sharing is changed in iPhone Settings > Health > Data Access (HIG HealthKit; never say HealthKit). Rules (docs/apple-health.md): height/weight latest within 1 year; sleep median of 14 nights, needs 3; activity weekly average over 28 days. Values are read back and confirmed before saving. -->
<!-- One person: height and weight were confirmed from her document 20 minutes earlier (History, Sun Oct 18 6:20 pm), so they show with that source; sleep 6.5, walking (moderate) 90 and vigorous 0 came from Apple Health (6:40 pm). Mochi then asks only the 4 still missing (R-V9-OutlookMissing). -->
<!-- No group heading: every row carries its own source chip (From Apple Health / From your document). Missing types use R-11&#8217;s dashed style with the contract wording "Not found in Apple Health". Partial: what came in is read back (read-only chips with source); the missing types are dashed "I&#8217;ll ask you" and become the next conversation questions, so nothing is defaulted. Change opens the Mochi change chat (no direct editing). Weight is shown as stored by the person; BMI is never shown. Bear twin (this person&#8217;s twin is the bear throughout). -->
