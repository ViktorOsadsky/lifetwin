<!-- LifeTwin R screens (failure paths, consent, Settings, history, notebook, Health fallbacks, previews, large text), v1. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and close sit in a fixed header (.hdr) or float pinned over the scroll view; they never scroll away. The header gets a 1px shadow only once content scrolls under it (Flutter AppBar scrolledUnderElevation). -->
<!-- From an idea card (Y-11 "A longer dog walk", R-9 built-in tip). One person everywhere: the R-V9 example (r_model/v9_out.json profile_used), moderate_recreation_min_week 90 -> 120 (step 15). compare() for this what-if = +0.054 points at year 5 (rounds to +0.1), so the follow-up result is the "Less than 1 in 100" state with no bear grid (Y-4 pattern). Assumed recommendation item experiment: {lever_id: "moderate_recreation_min_week", value: 120}. Try it opens the Experiment (Y-1) with this lever set on the what-if twin; the number appears there, from compare(), never here. Cancel closes the sheet. What-if only: recorded answers never change. -->
<!-- CSS for .whatif/.today pills is the Y set (lilac #B9B4F0 = What-if). Sheet: Cancel, swipe down or tap outside closes it. -->
