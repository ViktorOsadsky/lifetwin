<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and Close sit in a fixed header (.hdr) or the change-chat header; they never scroll away. -->
<!-- Band data rules (owner, 2026-10-23): band numbers are sensor estimates. They reach saved answers ONLY through a Mochi read-back the person confirms (D2). D3 (ruled 2026-10-24, calibration under way): a band estimate may change the Outlook ONLY after the person confirms it as their answer in the Mochi read-back (H-7). No H screen shows a survival number or a difference, and unconfirmed band data never moves the forecast. Band activity may change the twin's cosmetic mood only; never quiz/game health and never a prediction (APP-05, VAL-02). Raw samples never leave the band; minute records stay on the phone (D1). -->
<!-- TBD (owner, open): whether band summaries may be forwarded to outside AI providers (e.g. personalize.display_name). No H screen shows band data going to an AI provider until that is ruled. -->
<!-- APP-01 success. Pose proud (cheerful). What the band counts is a plain icon list (no chips); heart rate is listed in muted ink as "later" until the MAX30101 sensor ships (D5, HW-09). "Minutes stay on this phone" sits in the pinned dock, above the CTA, so it never scrolls away: minute records live in memory on the phone and are added up there (APP-02); what may leave the phone is spelled out in H-11. Haptic: success notification once. -->
