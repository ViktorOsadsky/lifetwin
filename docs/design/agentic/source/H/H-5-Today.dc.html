<!doctype html>
<!-- LifeTwin H screens (ESP32 wrist band: pairing, today, suggestions, reaction, heart rate, states, settings), v1. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- Pinned controls (usability rule, iPhone test): Back, Home and Close sit in a fixed header (.hdr) or the change-chat header; they never scroll away. -->
<!-- Band data rules (owner, 2026-10-23): band numbers are sensor estimates. They reach saved answers ONLY through a Mochi read-back the person confirms (D2). D3 (ruled 2026-10-24, calibration under way): a band estimate may change the Outlook ONLY after the person confirms it as their answer in the Mochi read-back (H-7). No H screen shows a survival number or a difference, and unconfirmed band data never moves the forecast. Band activity may change the twin's cosmetic mood only; never quiz/game health and never a prediction (APP-05, VAL-02). Raw samples never leave the band; minute records stay on the phone (D1). -->
<!-- TBD (owner, open): whether band summaries may be forwarded to outside AI providers (e.g. personalize.display_name). No H screen shows band data going to an AI provider until that is ruled. -->
<!-- APP-02 + APP-03 (+ APP-06 card). Everything here is computed on the phone from minute records in memory; nothing is sent to show this screen. "Synced just now" = time of the last minute record received (HW-07 resume); plain 17px #6B4E42 text, not a control. Hour chart = a 9-column grid (7 AM .. 3 PM); the label row uses the same grid: "7 AM" in column 1, "Noon" in column 6, "Now" in column 9. Bar height = steps that hour, one colour (#24806A); intensity lives only in the "12 min moderate" line (plain icon + text, no chip). The current hour is partial: #9FD9C3 fill with a 1.5px dashed #17594A border ("This hour"). A not-worn hour is a dashed baseline, not a bar ("Not worn"). The peak bar carries its value ("980"). Worn = 8 AM to now = 7 hours (3 PM partial); 7 of 10 wear segments filled, each with a centred dot. Dashed borders on mint use #8C6B5D. The axis ends at "Now". Every number carries the "Sensor estimate" tag; intensity cut-points are approximate (Hildebrand 2014 values, to be verified). Text alternative: the role=img label lists every hour. Wear meter: a day counts at 10+ hours worn (Troiano 2008 convention). Week tab: the same 7-day tiles as H-6, without the offer. Activity fact (APP-06): Paluch et al., Lancet Public Health 2022;7(3):e219-28, https://doi.org/10.1016/S2468-2667(21)00302-9. Why? sheet: "Big studies of many adults found that people who took more steps each day tended to live longer. These studies show a link, not proof that steps cause it, and they can't give you a personal number." No personal survival number, no years; unconfirmed band data never changes the forecast. Heart rate row stays dashed "Coming soon" until HW-09 lands, then opens H-9-HeartRate-Later. Banner slot above the tabs shows one band state at a time (H-10). -->
