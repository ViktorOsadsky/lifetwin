<!-- Customize (extends V-6). Cosmetics are direct choices because they are not health answers; they never change any number. Body and age (owner ruling): the twin's build (a few dignified silhouettes) and age band (adult, middle-aged, older: grey fur or hair, softer posture) FOLLOW CONFIRMED USER DATA only. No body-shape or age picker; no numbers, labels or BMI; build never signals health; experiments and quiz never reshape the twin. One line explains it, and its Change link opens the Mochi change chat (Z-10). Customize offers: twin type, hats, tops, glasses, fur colour (human: hair and skin), helpers, and later the seated / wheelchair pose (hidden until a seated-in-chair sprite exists; never a placeholder tile). Selection: mint tile + check badge, live on the twin; the look carries across tabs; Save look commits; Back without saving asks "Keep your changes?". Back and Name are pinned (outside the scroll view). The twin name is never a text field: "Name" opens the Mochi name chat (Q-13), per the no-direct-editing ruling. Layout: five equal 64x64 tabs, 6 px gap, at normal size; snapping scroll + 24 px fade + pinned 48x64 More chevron at textScale 1.3+; grid repeat(3, 1fr), gap 10, tile min 96x92. Reduced motion: choosing a tile swaps the item on the twin instantly (no tween, no bounce). Thumbnails and layers are DRAFTS from cosmetics/ (other agent). -->
<!-- Fur: preview applies the item's per-channel tables (cosmetics/fur/cocoa/filter.svg) to the body and head copy plus the blush overlay; the app bakes per-part PNGs (tools/fur.py) so eyes and clothes are not recoloured. Human twin shows Skin and Hair here instead (same grid). -->
