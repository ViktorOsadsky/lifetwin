<!doctype html>
<!-- LifeTwin quiz arena, Customize and Apple Health today (prefix Q), round 2. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- VARIANT: older/larger. The twin's age band and build follow confirmed user data; this default sprite stands in until those drafts land. -->
<!-- Today from Apple Health: read-only display of today's steps, active energy, workouts and resting heart rate (HKQuantityType stepCount, activeEnergyBurned, HKWorkout, restingHeartRate), refreshed when the app opens. Kept apart from the health profile and the Outlook: nothing here is saved as an answer, resting heart rate is not a model input, and activity reaches the Outlook only as values the person confirms (weekly check-in, Z-16). The twin's mood never comes from this card: here it is content / steady (the default), set by check-ins and confirmed logs. Sample values for the design only; never real records. Health access off: "Apple Health is off" + "Turn on in Settings". Empty day: dashes + "Nothing yet today". Room card shows two tiles (Steps, Workouts) for less text; active energy and resting heart rate appear when the card is tapped (detail sheet, same view-only rules). Why? sheet: "This card only shows today. Your outlook changes only when you confirm what you did, in your check-in." Reduced motion: the mood sticker appears in place without its 2 deg settle and the twin holds a still frame. -->
<!-- Room quiz entry: "Play the quiz" pill on the scene (opens Q-1). Window 288 with the chip at top 12 so it clears the hat. Low quiz game health never carries into this real-mood chip or the twin's Room pose: game health lives only in the quiz arena. -->
