<!doctype html>
<!-- LifeTwin quiz arena, Customize and Apple Health today (prefix Q), round 2. Tokens and components match V and X. Twin sprites: sprites/v2, one scale per character (stand pose = 196px), feet on one baseline. -->
<!-- Flutter: the page is a scroll view with the dock AND back/close pinned (never inside the scroll view); scroll content gets bottom padding = dock height + 16. Sections are flow layout with min-heights, never fixed heights, so 200% text grows. Only the plate window has a fixed height; the twin sits in a fixed 200px box. -->
<!-- VARIANT: older/larger. The twin's age band and build follow confirmed user data; this default sprite stands in until those drafts land. -->
<!-- Quiz arena (MASTER_PLAN "Quiz mode and game-health state"; LocalScoringRules on main): game_health is its own value, start 100, clamp 0-100, never touches confirmed_profile, experimental_profile or prediction, and never calls the model. Each question version is scored once, locally, the moment it is locked, before any network call; a network failure or an unreviewed question is never scored as wrong. Wrong = wrong_effect (-5 of 100, mascot_event quiz_sick -> sleepy.png "a bit tired"). Right = correct_effect (+5 if below 100, quiz_recovering -> proud.png). Reading why after a wrong answer = review_effect (+5, once). Retry after review is practice, unscored. Meter: Semantics(label: "Game health", value: "full" | "a bit low"); no number on screen; 140x26 bar (136 px inner), solid #C8553D fill, no notches. Fill width = 136 x health / 100 exactly (100 -> 136 px, 95 -> 129 px). The drained part shows as a ghost (#FFE1D6, 2px dashed #8C6B5D) whose width is the drained width with a 24 px minimum, right-aligned in the track (a -5 drain is 7 px, so the ghost also covers the last 17 px of fill to stay visible); tiers: full (100) "Game health", 86-99 "Game health &#183; a bit low" (sleepy pose), 85 or less "Game health &#183; low" (cozy / sit pose); at 0 the twin is still just tired and resting (sit), never a death, hospital or fallen pose, and review still refills it; below 100 the heart wears a bandage and the label reads "Game health &#183; a bit low". Never teal, never a percentage, never a curve or bear grid (those belong to the Outlook). -->
<!-- Motion (motion-design skill, Playful personality, one authored moment per state; Lottie files from lottie/ui/manifest.json): select = tile press 0.97 -> 1.0, 150 ms ease-out-back; lock = radio morphs into a lock and the other tiles animate their COLOURS to the dimmed tokens (text #6B4E42, border #A88B7D, background #FBF7F0) over 180 ms, opacity stays 1 (no opacity fade anywhere); reveal choreography after "Check my answer" (Q-3 lasts 300 ms or less): 0 ms answer tile turns Right!/Answer, 120 ms twin pose changes, 300 ms meter dip (wrong) or sparkle (right), about 700 ms screen-reader announcement; right = proud pose pop (0.92 -> 1.04 -> 1, 320 ms ease-out-back) + Lottie "sparkle_burst_right" once; no bar shimmer when already full; wrong = sleepy pose with one slow 6 deg sway (700 ms sine) + Lottie "heart_dip" (fill eases 136 -> 129 px, -5 of 100, 400 ms ease-in-out; the ghost appears and stays) and the bandaged heart pulses once 1 -> 1.15 -> 1 over 240 ms, and a 24 px broken heart pops from the bar end and rises 16 px while fading (600 ms ease-out); recovery = Lottie "heart_refill" (ghost refills 300 ms ease-out-back, bandage drops). Reduced motion: static frames (manifest reduced_motion_frame), static pose, and the SPOKEN caption below; no sway, no pulse. -->
<!-- Spoken reduced-motion captions (no numbers): wrong "Oops! Your twin feels a little tired. Game health is a little lower. It is just a game. Your real health has not changed." right "Great answer! Your twin is happy. Game health is full." review "Thanks for reading! Your twin feels better. Game health is back to full." -->
<!-- States board (compact; the dashed tags are annotations, not app UI). 1) Network failure or an unreviewed question: never scored (network_failure_is_unscored); the meter is untouched; "Try again" re-checks the same locked answer. 2) Back or swipe mid-quiz opens "Leave quiz?": answers already scored stay scored, game health stays, the round can be resumed from the Room; "Keep playing" is the default. 3) Reduced motion: static pose (still frame), no sway, pulse, sparkle or broken-heart rise; the caption is shown visibly AND spoken (full spoken text: Oops! Your twin feels a little tired. Game health is a little lower. It is just a game. Your real health has not changed.). -->
