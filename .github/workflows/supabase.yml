name: Supabase backend checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - name: Format and type check
        working-directory: supabase/functions/lifetwin-api
        run: |
          deno fmt --check
          deno check index.ts
      - name: Contracts and provider boundaries (no network permission or keys)
        working-directory: supabase/functions/lifetwin-api
        run: deno test --allow-read --allow-env '*.test.ts'
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked backend dependencies
        run: |
          python -m pip install uv==0.13.5
          uv sync --locked --python 3.11
      - name: Validate exports and deployment helpers
        run: |
          uv run ruff check scripts/server_env.py scripts/supabase_bridge.py scripts/deployment_smoke.py scripts/export_edge_*.py
          uv run ruff format --check scripts/server_env.py scripts/supabase_bridge.py scripts/deployment_smoke.py scripts/export_edge_*.py
          uv run python scripts/export_edge_contracts.py --check
          uv run python scripts/export_edge_conversation.py --check
          uv run python scripts/export_edge_wellness.py --check
          uv run python scripts/export_edge_intent.py --check
